name: Lock issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Lock issue
        run: |
          gh issue lock "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
          echo "Locked issue #${{ github.event.issue.number }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
